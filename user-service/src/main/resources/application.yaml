server:
 port: ${USER_SERVICE_PORT_NUMBER:8081}

kafka:
  topics:
    transaction:
      listener: ${KAFKA_TRANSACTION_USERNAME-VALIDATION_LISTENER:banking-microservices.transaction.money-service.block-money.success.v1}
      sender: ${KAFKA_TRANSACTION_USERNAME-VALIDATION_SENDER:banking-microservices.transaction.user-service.username-validation.success.v1}
      error: ${KAFKA_TRANSACTION_USERNAME-VALIDATION_ERROR:banking-microservices.transaction.user-service.username-validation.error.v1}
    create-user:
      authservicelistener: ${KAFKA_AUTH_SERVICE_CREATE_USER_LISTENER:banking-microservices.create-user.auth-service.progress.v1}
      sender: ${KAFKA_CREATE_USER_SENDER:banking-microservices.username-validation.user-service.progress.v1}
      listener: ${KAFKA_CREATE_USER_LISTENER:banking-microservices.create-user.money-service.success.v1}
      error: ${KAFKA_CREATE_USER_ERROR:banking-microservices.create-user.money-service.error.v1}
    username-validation:
      sender: ${KAFKA_USERNAME_VALIDATION_SENDER:banking-microservices.username-validation.user-service.success.v1}
      listener: ${KAFKA_USERNAME_VALIDATION_LISTENER:banking-microservices.username-validation.money-service.progress.v1}
      error: ${KAFKA_USERNAME_VALIDATION_ERROR:banking-microservices.username-validation.money-service.error.v1}

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
  # Kubernetes Service Discovery
  cloud:
    kubernetes:
      discovery:
        enabled: true
  # Veritabanı Ayarları
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_users}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect


# Monitoring (Opsiyonel ama tavsiye edilir)
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging: # Bağlantı: Loglama. Varsa: Uygulama takibi. Yoksa: Karanlık.
  pattern: # Bağlantı: Format. Varsa: Okunabilir. Yoksa: Karışık.
    console: "%-5level --- [user-service] : %msg%n" # Bağlantı: Konsol Dizilimi. Varsa: Tarih başta, mesaj sonda. Yoksa: Varsayılan Spring logu.
  level: # Bağlantı: Log Seviyesi. Varsa: Gürültü engellenir. Yoksa: Çok log basar.
    root: INFO # Bağlantı: Genel Seviye. Varsa: Önemli bilgiler. Yoksa: Debug detayları.
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
