server:
 port: ${USER_SERVICE_PORT_NUMBER:8081}

kafka:
  topics:
    create-user:
      authservicelistener: {$KAFKA_AUTH-SERVICE_CREATE-USER_LISTENER:banking-microservices.create-user.auth-service.progress.v1}
      sender: ${KAFKA_CREATE_USER_SENDER:banking-microservices.username-validation.user-service.progress.v1}
      listener: ${KAFKA_CREATE_USER_LISTENER:banking-microservices.create-user.money-service.success.v1}
      error: ${KAFKA_CREATE_USER_ERROR:banking-microservices.create-user.money-service.error.v1}
    username-validation:
      sender: ${KAFKA_USERNAME_VALIDATION_SENDER:banking-microservices.username-validation.user-service.success.v1}
      listener: ${KAFKA_USERNAME_VALIDATION_LISTENER:banking-microservices.username-validation.money-service.progress.v1}
      error: ${KAFKA_USERNAME_VALIDATION_LISTENER:banking-microservices.username-validation.money-service.error.v1}

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  # Kubernetes Service Discovery
  cloud:
    kubernetes:
      discovery:
        enabled: true
  # Veritabanı Ayarları
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_users}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  zipkin:
    base-url: ${SPRING_ZIPKIN_BASE_URL:http://localhost:9411}

# --- SADECE OPENFEIGN AYARLARI ---
feign:
  # Circuit Breaker KAPALI (Varsayılan zaten kapalıdır ama emin olmak için sildik)
  client:
    config:
      default:
        # Timeoutlar önemlidir. Karşı taraf cevap vermezse sonsuza kadar beklemesin.
        connectTimeout: 5000 # 5 saniyede bağlanamazsa hata ver
        readTimeout: 5000    # 5 saniyede cevap gelmezse hata ver
        loggerLevel: BASIC   # Loglarda temel istekleri gör

# Monitoring (Opsiyonel ama tavsiye edilir)
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  endpoints:
    web:
      exposure:
        include: health,info

logging: # Bağlantı: Loglama. Varsa: Uygulama takibi. Yoksa: Karanlık.
  pattern: # Bağlantı: Format. Varsa: Okunabilir. Yoksa: Karışık.
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n" # Bağlantı: Konsol Dizilimi. Varsa: Tarih başta, mesaj sonda. Yoksa: Varsayılan Spring logu.
  level: # Bağlantı: Log Seviyesi. Varsa: Gürültü engellenir. Yoksa: Çok log basar.
    root: INFO # Bağlantı: Genel Seviye. Varsa: Önemli bilgiler. Yoksa: Debug detayları.
