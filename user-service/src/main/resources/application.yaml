server:
  port: ${USER_SERVICE_PORT_NUMBER:8081}

grpc:
  server:
    port: ${USER_SERVICE_GRPC_PORT:9194}

kafka:
  topics:
    transaction:
      listener: ${KAFKA_TRANSACTION_USER_VALIDATION_REQUEST_TOPIC:banking-microservices.transaction.user-validation.request.v1}
      sender: ${KAFKA_TRANSACTION_USER_VALIDATION_SUCCESS_TOPIC:banking-microservices.transaction.user-validation.success.v1}
      error: ${KAFKA_TRANSACTION_FAILED_TOPIC:banking-microservices.transaction.failed.v1}
    create-user:
      sender: ${KAFKA_USER_CREATED_TOPIC:banking-microservices.user.created.v1}
      listener: ${KAFKA_MONEY_ACCOUNT_CREATED_TOPIC:banking-microservices.money.account.created.v1}
      error: ${KAFKA_MONEY_ACCOUNT_CREATE_FAILED_TOPIC:banking-microservices.money.account.create-failed.v1}

spring:
  application:
    name: user-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: user-service-group
      auto-offset-reset: earliest
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.use.type.headers: false
  cloud:
    kubernetes:
      discovery:
        enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        hbm2ddl:
          auto: ${SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO:update}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:banking}
  client-id: ${KEYCLOAK_CLIENT_ID:banking-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:secret123}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  bootstrap:
    enabled: ${KEYCLOAK_BOOTSTRAP_ENABLED:true}
    wait-timeout-seconds: ${KEYCLOAK_BOOTSTRAP_WAIT_TIMEOUT_SECONDS:180}
    test-user-email: ${KEYCLOAK_BOOTSTRAP_TEST_USER_EMAIL:testuser@bank.com}
    test-user-password: ${KEYCLOAK_BOOTSTRAP_TEST_USER_PASSWORD:pass123}
    admin-user-email: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER_EMAIL:admin@gmail.com}
    admin-user-password: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER_PASSWORD:admin123}

management:
  endpoints:
    web:
      base-path: /api/user-service/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    kafka:
      enabled: false
  security:
    enabled: false

logging:
  pattern:
    console: "%-5level --- [user-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: INFO
