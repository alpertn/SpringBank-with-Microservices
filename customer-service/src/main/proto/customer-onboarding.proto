syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.banking_microservices.customer_service.grpc";
option java_outer_classname = "CustomerOnboardingProto";

package customer.onboarding.v1;

message CustomerOnboardingCreateRequest {
  string keycloak_id = 1;
  string email = 2;
  bool email_verified = 3;
  string phone_number = 4;
  bool phone_verified = 5;
  string name = 6;
  string middle_name = 7;
  string surname = 8;
  string birthdate = 9;
  string national_id = 10;
  string nationality_code = 11;
  string marital_status = 12;
  string raw_address = 13;
  string address_country_code = 14;
}

message CustomerOnboardingCreateResponse {
  string customer_id = 1;
  string keycloak_id = 2;
  string status = 3;
}

service CustomerOnboardingGrpcService {
  rpc CreateCustomerForUser(CustomerOnboardingCreateRequest) returns (CustomerOnboardingCreateResponse);
}
