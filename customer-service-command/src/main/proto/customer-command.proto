syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.banking_microservices.customer_service_command.grpc";
option java_outer_classname = "CustomerCommandProto";

package customer.command.v1;

message CustomerAddress {
  string type = 1;
  string raw_address = 2;
  string country = 3;
  string country_code = 4;
  string province = 5;
  string district = 6;
  string neighborhood = 7;
  string road = 8;
  string building = 9;
  string building_number = 10;
  string entrance = 11;
  string floor = 12;
  string unit = 13;
  string postal_code = 14;
  string parse_status = 15;
  string parser = 16;
  string parser_version = 17;
}

message CustomerCommandCreateRequest {
  string keycloak_id = 1;
  string realm = 2;
  string email = 3;
  bool email_verified = 4;
  string phone_number = 5;
  bool phone_verified = 6;
  string user_type = 7;
  string birthdate = 8;
  string name = 9;
  string middle_name = 10;
  string surname = 11;
  string sex = 12;
  string nationality_code = 13;
  string preferred_language = 14;
  string status = 15;
  int32 risk_score = 16;
  bool mfa_enabled = 17;
  string mfa_method = 18;
  bool special_customer = 19;
  int32 special_customer_score = 20;
  string kyc_status = 21;
  string national_id = 22;
  string account_status = 23;
  string marital_status = 24;
  string risk_class = 25;
  string segment = 26;
  int32 segment_score = 27;
  string political_exposure_status = 28;
  string employment_category = 29;
  CustomerAddress address = 30;
}

message CustomerCommandUpdateProfileRequest {
  string customer_id = 1;
  string email = 2;
  string phone_number = 3;
  string name = 4;
  string middle_name = 5;
  string surname = 6;
  string birthdate = 7;
  string sex = 8;
  string nationality_code = 9;
  string preferred_language = 10;
  string user_type = 11;
}

message CustomerCommandContactVerificationRequest {
  string customer_id = 1;
  bool email_verified = 2;
  bool phone_verified = 3;
}

message CustomerCommandStatusRequest {
  string customer_id = 1;
  string status = 2;
}

message CustomerCommandKycRequest {
  string customer_id = 1;
  string kyc_status = 2;
}

message CustomerCommandRiskRequest {
  string customer_id = 1;
  int32 risk_score = 2;
}

message CustomerCommandMfaRequest {
  string customer_id = 1;
  bool mfa_enabled = 2;
  string mfa_method = 3;
}

message CustomerCommandSpecialRequest {
  string customer_id = 1;
  bool special_customer = 2;
  int32 special_customer_score = 3;
}

message CustomerCommandCustomerIdRequest {
  string customer_id = 1;
}

message CustomerCommandResponse {
  string id = 1;
  string keycloak_id = 2;
  string realm = 3;
  string email = 4;
  bool email_verified = 5;
  string phone_number = 6;
  bool phone_verified = 7;
  string user_type = 8;
  string status = 9;
  string birthdate = 10;
  string name = 11;
  string middle_name = 12;
  string surname = 13;
  string sex = 14;
  int32 risk_score = 15;
  bool mfa_enabled = 16;
  string mfa_method = 17;
  string preferred_language = 18;
  bool special_customer = 19;
  int32 special_customer_score = 20;
  string kyc_status = 21;
  string nationality_code = 22;
  bool deleted = 23;
  int64 version = 24;
  string created_at = 25;
  string updated_at = 26;
  string national_id_masked = 27;
  string account_status = 28;
  string marital_status = 29;
  string risk_class = 30;
  string segment = 31;
  int32 segment_score = 32;
  string political_exposure_status = 33;
  string employment_category = 34;
  CustomerAddress address = 35;
}

service CustomerCommandGrpcService {
  rpc CreateCustomer(CustomerCommandCreateRequest) returns (CustomerCommandResponse);
  rpc UpdateProfile(CustomerCommandUpdateProfileRequest) returns (CustomerCommandResponse);
  rpc UpdateContactVerification(CustomerCommandContactVerificationRequest) returns (CustomerCommandResponse);
  rpc UpdateStatus(CustomerCommandStatusRequest) returns (CustomerCommandResponse);
  rpc UpdateKycStatus(CustomerCommandKycRequest) returns (CustomerCommandResponse);
  rpc UpdateRiskScore(CustomerCommandRiskRequest) returns (CustomerCommandResponse);
  rpc UpdateMfa(CustomerCommandMfaRequest) returns (CustomerCommandResponse);
  rpc UpdateSpecialCustomer(CustomerCommandSpecialRequest) returns (CustomerCommandResponse);
  rpc SoftDelete(CustomerCommandCustomerIdRequest) returns (CustomerCommandResponse);
}
