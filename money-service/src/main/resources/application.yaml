kafka:
  topics:
    create-user:
      sender: ${KAFKA_MONEY_ACCOUNT_CREATED_TOPIC:banking-microservices.money.account.created.v1}
      listener: ${KAFKA_USER_CREATED_TOPIC:banking-microservices.user.created.v1}
      error: ${KAFKA_MONEY_ACCOUNT_CREATE_FAILED_TOPIC:banking-microservices.money.account.create-failed.v1}
    transaction:
      blockmoney:
        listener: ${KAFKA_TRANSACTION_CREATED_TOPIC:banking-microservices.transaction.created.v1}
        sender: ${KAFKA_TRANSACTION_MONEY_BLOCKED_TOPIC:banking-microservices.transaction.money-blocked.v1}
        user-validation-sender: ${KAFKA_TRANSACTION_USER_VALIDATION_REQUEST_TOPIC:banking-microservices.transaction.user-validation.request.v1}
      transactionmoney:
        # Diyagram Adım 1: created.v1'i dinle → DEPOSIT/WITHDRAW direkt işle, TRANSFER → blockFunds()
        listener: ${KAFKA_TRANSACTION_CREATED_TOPIC:banking-microservices.transaction.created.v1}
        sender: ${KAFKA_TRANSACTION_COMPLETED_TOPIC:banking-microservices.transaction.completed.v1}
      transferexecute:
        # Diyagram Adım 4 (YENİ): fraud-checked.v1 → TRANSFER gerçek para hareketi (withdrawBlocked + deposit)
        listener: ${KAFKA_TRANSACTION_FRAUD_CHECKED_TOPIC:banking-microservices.transaction.fraud.checked.v1}
      result:
        sender: ${KAFKA_TRANSACTION_COMPLETED_TOPIC:banking-microservices.transaction.completed.v1}
      error: ${KAFKA_TRANSACTION_FAILED_TOPIC:banking-microservices.transaction.failed.v1}

      #Saga
      saga:
          listener: ${KAFKA_TRANSACTION_SAGA_CREATED_TOPIC:banking-microservices.transaction.saga.created.v1}
          sender: ${KAFKA_TRANSACTION_SAGA_MONEY_COMPLETED_TOPIC:banking-microservices.transaction.saga.money.completed.v1}
          error:  ${KAFKA_TRANSACTION_SAGA_MONEY_FAILED_TOPIC:banking-microservices.transaction.saga.money.failed.v1}



##            - name: KAFKA_TRANSACTION_SAGA_CREATED_TOPIC
#              value: banking-microservices.transaction.saga.created.v1
#            # Listener (listen Money-service)
#            - name: KAFKA_TRANSACTION_SAGA_MONEY_COMPLETED_TOPIC
#              value: banking-microservices.transaction.saga.money.completed.v1
#            - name: KAFKA_TRANSACTION_SAGA_MONEY_FAILED_TOPIC
#              value: banking-microservices.transaction.saga.money.failed.v1
server:
  port: ${MONEY_SERVICE_PORT_NUMBER:8082}

spring:
  application:
    name: money-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: money-service-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_money}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 580000
      keepalive-time: 150000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          auto: ${SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO:update}
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      base-path: /api/money-service/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    redis:
      enabled: false
    kafka:
      enabled: false
  security:
    enabled: false

logging:
  pattern:
    console: "%-5level --- [money-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
