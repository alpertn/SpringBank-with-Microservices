kafka:
  topics:
    create-user:
      sender: ${KAFKA_CREATE_USER_SENDER:banking-microservices.create-user.money-service.success.v1}
      listener: ${KAFKA_CREATE_USER_LISTENER:banking-microservices.username-validation.user-service.progress.v1}
      error: ${KAFKA_CREATE_USER_ERROR:banking-microservices.create-user.money-service.error.v1}
    transaction:
      blockmoney:
        listener: ${KAFKA_TRANSACTION_BLOCKUSER_LISTENER:banking-microservices.transaction.transaction-service.created.v1}
        sender: ${KAFKA_TRANSACTION_BLOCKUSER_SENDER:banking-microservices.transaction.money-service.block-money.success.v1}
      transactionmoney:
        # Diyagram Adım 1: created.v1'i dinle → DEPOSIT/WITHDRAW direkt işle, TRANSFER → blockFunds()
        listener: ${KAFKA_TRANSACTION_TOPIC_LISTENER:banking-microservices.transaction.transaction-service.created.v1}
        sender: ${KAFKA_TRANSACTION_TOPIC_SENDER:banking-microservices.transaction.transaction-service.success.v1}
      transferexecute:
        # Diyagram Adım 4 (YENİ): fraud-checked.v1 → TRANSFER gerçek para hareketi (withdrawBlocked + deposit)
        listener: ${KAFKA_TRANSACTION_TRANSFER_EXECUTE_LISTENER:banking-microservices.transaction.fraud-service.checked.v1}
      result:
        sender: ${KAFKA_TRANSACTION_RESULT_SENDER:banking-microservices.transaction.result.success.v1}
      error: ${KAFKA_TRANSACTION_TOPIC_ERROR:banking-microservices.transaction.transaction-service.error.v1}
    username-validation:
      sender: ${KAFKA_USERNAME_VALIDATION_SENDER:banking-microservices.username-validation.money-service.progress.v1}
      listener: ${KAFKA_USERNAME_VALIDATION_LISTENER:banking-microservices.username-validation.user-service.success.v1}

server:
  port: ${MONEY_SERVICE_PORT_NUMBER:8082}

spring:
  application:
    name: money-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: money-service-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_money}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

management:
  endpoints:
    web:
      base-path: /api/money-service/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  security:
    enabled: false

logging:
  pattern:
    console: "%-5level --- [money-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN