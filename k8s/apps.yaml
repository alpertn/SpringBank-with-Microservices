#
#Spring Gateway --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: banking/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
          env:
            - name: USER_SERVICE_URL # SERVICE DISCOVERY ICIN
              value: http://user-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8084 # SERVICE DISCOVERY ICIN
            - name: MONEY_SERVICE_URL
              value: http://money-service:8082 # SERVICE DISCOVERY ICIN
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083 # SERVICE DISCOVERY ICIN
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/banking
            - name: SPRING_R2DBC_USERNAME
              value: banking_admin
            - name: SPRING_R2DBC_PASSWORD
              value: local_password
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411 # SERVICE DISCOVERY GIBI BURAYI ARIYOR VE BULUYOR VE VERILER ZIPKININ BURASINA GIDIYOR HEM ZIPKINE GIDER HEMDE BURAYA GIDER
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8090
      targetPort: 8090
  type: LoadBalancer
