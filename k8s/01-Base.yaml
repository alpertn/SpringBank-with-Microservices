# Kubernet Icin Onemli Olanlar.
### 1
# spec (Specification) basligi ile type: LoadBalancer yazarsaniz uzaktan portunu yazarak erisilebilir. yazmazsaniz erisilemez.
# Yapmazsan Otomatik olarak type : ClusterIP olarak isaretlenir buda mikroservisler arasinda iletiism icindir disariya acik degildir.
# Gateway da LoadBalancer'dır ordan aldigi bilgileri ClusterIp olan veya olmayan mikroservislere yonlendrir.
### 2
## Dns ile haberlesme
# metadata:
#  name: keycloak
# namespace: banking-microservice
# Bu Seneryoda Dns ismi keycloack olucak ve diger mikroservisler keycloack:PORTNUMBER ile iletisim kurablecek buraya.



apiVersion: v1
kind: Namespace
metadata:
  name: banking-microservices # Tum banking mikroservisler icin izole

---

#
#Postgres ConfigMap --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: v1
kind: ConfigMap
metadata:
  name: Postgres-Database-Init-Configmap-Script
  namespace: banking-microservices
data:
  # Postgres .sql ı gordugudne ve postgres'ı tanimladigimizda otomatik olarak calistirir GRANT ALL PRIVILEGES ON DATABASE full yetki verir dblere
  init-databases.sql: |
    CREATE DATABASE banking_auth;
    CREATE DATABASE banking_users;
    CREATE DATABASE banking_money;
    CREATE DATABASE banking_transactions;
    CREATE DATABASE banking_fraud;
    CREATE DATABASE banking;

    GRANT ALL PRIVILEGES ON DATABASE banking_auth TO banking_admin;
    GRANT ALL PRIVILEGES ON DATABASE banking_users TO banking_admin;
    GRANT ALL PRIVILEGES ON DATABASE banking_money TO banking_admin;
    GRANT ALL PRIVILEGES ON DATABASE banking_transactions TO banking_admin;
    GRANT ALL PRIVILEGES ON DATABASE banking_fraud TO banking_admin;
    GRANT ALL PRIVILEGES ON DATABASE banking TO banking_admin;
---
#
#Postgres Database Deployment Script --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
# Deployment Nasil calistirilacaginin configini yapar.
kind: Deployment
metadata:
  name: Postgres
  namespace: banking-microservices
# Spec: Specification yani information
spec:
  replicas: 1  # Kac Tane Pod calistirialcak
  selector:
    matchLabels:
      app: postgres # Tum podlarin uygulama ismi
  template:
    metadata:
      labels:
        app: postgres # Pod a yapistirilan etiket
    spec:
      containers:
        - name : postgres # " - " liste icin kullanilir
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: banking_admin
            - name: POSTGRES_PASSWORD
              value: banking_admin
            - name: POSTGRES_DB # Docker calistirildiktan sonra olustacak database. bu database init-databases.sql configini calistiracak ve ayri ayri databaseler olusturucak
              value: postgres
          volumeMounts:
            - mountPath: /var/lib/postgresql/data  # Container içindeki klasör PostgreSQL verilerini tutar
              name: postgres-data                   # Volume'un ismi (aşağıdaki volumes kısmıyla eşleşmeli)

            - mountPath: /docker-entrypoint-initdb.d  # Init script'lerin konulacağı klasör
              name: init-script                        # Volume'un ismi (ConfigMap'ten gelir)
      volumes:
        - name: postgres-data
          emptyDir: {} # Bos olmasini yani yeniden baslatildiginda silinmesini kaydolammasini saglar
        - name: init-script
          configMap:
            name: Postgres-Database-Init-Configmap-Script # Init scriptini alacagi yer.

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: banking-microservices
spec:
  selector:
    app: postgres # postgres adina gelen tum istekleri bu alicak ve  app: postgres  adinda tanimlanan yere gondericek hepsini
  ports:
    - port: 5432 # veriyi alacagi port
      targetPort: 5432 # veriyi gonderecegi port

---

#
#REDIS CACHE SETTINGS --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: banking-microservices
spec:
  replicas: 1 # pod number
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:alpine
          ports:
            - containerPort : 6379
---

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: banking-microservices
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379

---
#
#ZIPKIN LOGGING SETTINGS --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin
          ports:
            - containerPort: 9411
---

apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: banking-microservices
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411

---

#
# Zookeper For Kafka ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper # Bunun altinda calisir deployment
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper # altinda calistigi uygulamalarin ismi deploymentin yonetecegi podlarin labeli. Bu podlari yonetecek
  template:
    metadata:
      labels:
        app: zookeeper # Podlarin etiketi. yukardakiyle ayni olmali
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.5.0
          ports:
            - containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"

---

apiVersion: v1
kind: Service
metadata:
  name: zookeeper # Diger servisler bu isimle zookeeper:2181 seklinde ulasir. Kubernetes icinde DNS gibi calisir.
  namespace: banking-microservices
spec:
  selector:
    app: zookeeper # app: zookeeper etiketli podlara gelen tum istekleri bu service karsilar ve yonlendirir
  ports:
    - port: 2181 # Zookeeper'in dinledigi standart port. Kafka metadata bilgilerini buradan alir. Topic, partition bilgileri burada tutulur.
      targetPort: 2181 # Container icindeki porta yonlendir. port ve targetPort genelde ayni olur ama farkli da olabilir.

---

#
# KAFKA DEPLOYMENT --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka  # Bu deployment'ın adı
  namespace: banking-microservices
spec:
  replicas: 1  # 1 adet Kafka pod'u oluştur
  selector:
    matchLabels:
      app: kafka  # "app=kafka" etiketli pod'ları yönet
  template:
    metadata:
      labels:
        app: kafka  # Oluşturulacak pod'lara "app=kafka" etiketi yapıştır
    spec:
      containers:
        - name: kafka  # Container adı
          image: confluentinc/cp-kafka:7.5.0  # Kafka Docker image
          ports:
            - containerPort: 9092  # Kafka'nın çalışacağı port
          env:
            - name: KAFKA_ZOOKEEPER_CONNECT  # ZORUNLU: Kafka, Zookeeper'a nasıl bağlanacak
              value: zookeeper:2181
            - name: KAFKA_ADVERTISED_LISTENERS  # ZORUNLU: Client'ların Kafka'ya bağlanma adresi
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR  # ZORUNLU (tek broker): Varsayılan 3, tek broker'da hata verir
              value: "1"

---

apiVersion: v1
kind: Service
metadata:
  name: kafka  # Service adi. Diger servisler kafka:9092 yazarak ulasir. Kubernetes DNS otomatik cozumler. Ornegin user-service icinden kafka:9092 yazinca bu service'e gelir.
  namespace: banking-microservices
spec:
  selector:
    app: kafka  # app=kafka etiketli podlara trafik yonlendirir. Birden fazla kafka pod olsa bile hepsine load balance yapar.
  ports:
    - port: 9092  # Kafka broker portu. Producer mesaj gonderirken, Consumer mesaj alirken bu porta baglanir. SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092 bu yuzden calisiyor.
      targetPort: 9092 # Pod icindeki Kafka container'inin dinledigi port

---

#
# KEYCLOAK - Kimlik Dogrulama Servisi ---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: banking-microservices
spec:
  replicas: 1 # Keycloak tek instance calisir. Production'da HA (High Availability) icin 2+ yapilabilir ama veritabani paylasimi gerekir.
  selector:
    matchLabels:
      app: keycloak # Bu deployment app=keycloak etiketli podlari yonetir
  template:
    metadata:
      labels:
        app: keycloak # Podlara yapistirilacak etiket. Service bu etiketi arar.
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0 # Keycloak resmi image. Red Hat tarafindan gelistiriliyor.
          args: ["start-dev"] # Development modu. Production'da start --optimized kullan ve veritabani bagla.
          ports:
            - containerPort: 8080 # Keycloak web arayuzu ve API bu portta calisir. Admin console, token endpoint vs. buradan erisiliyor.
          env:
            - name: KEYCLOAK_ADMIN # Keycloak admin paneline giris icin kullanici adi
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD # Admin sifresi. Production'da guvenli bir Secret kullan!
              value: admin
            - name: KC_HTTP_ENABLED # HTTP aktif. Production'da HTTPS kullan (KC_HTTPS_ENABLED).
              value: "true"
            - name: KC_HOSTNAME_STRICT # Hostname kontrolu kapali. Production'da true yap ve domain belirt.
              value: "false"

---

apiVersion: v1
kind: Service
metadata:
  name: keycloak # Diger servisler keycloak:8080 seklinde ulasir. Gateway JWT_TOKEN_ISSUER_URI=http://keycloak:8080/realms/banking ile token dogrular.
  namespace: banking-microservices
spec:
  selector:
    app: keycloak # app=keycloak etiketli podlara yonlendir
  ports:
    - port: 8080 # Keycloak portu. Auth-service KEYCLOAK_SERVER_URL=http://keycloak:8080 ile buraya baglanir.
      targetPort: 8080
  type: LoadBalancer # Disaridan erisim icin. localhost:8080 ile admin paneline girebilirsin. minikube service keycloak komutuyla eris.

---

