#
#User-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service # olusturulan tum portlar ubnun altinda olusturulacak namespace bu olacak
  template:
    metadata:
      labels:
        app: user-service # User servicenin altinda olusturulanlari burdan duzenle
    spec:
      containers:
        - name: user-service
          image: banking/user-service:1.0.0
          imagePullPolicy: IfNotPresent # bu yoksa internetten bul ve indir Sen bu projeyi local (yerel) ortamda geliştiriyorsan; IfNotPresent ayarı, Kubernetes'in internete boşuna gidip "Böyle bir şey yok" hatası almasını engeller. Local Geliştirme: IfNotPresent (Bilgisayarımdakini kullan). Canlı Ortam (Production): Genelde Always (veya private registry ayarları) kullanılır ki versiyonlar karışmasın.'
          ports:
            - containerPort: 8081 # ContainerPort Label'dir. kubernetes kubectl get pods -o wide kubectl describe pod user-service-xyz kodlaıryla komut calsıtırdııgmızda burdaki port gozukur. Labeldır bu. sprıng bootla aynı olması onerılır bu olmayadabılır.
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_users
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411 # SERVICE DISCOVERY GIBI BURAYI ARIYOR VE BULUYOR VE VERILER ZIPKININ BURASINA GIDIYOR HEM ZIPKINE GIDER HEMDE BURAYA GIDER
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # Port Numarasi
            - name: USER_SERVICE_PORT_NUMBER
              value: "8081"
            # --- KAFKA AYARLARI ---
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092

#server:
#  port: ${MONEY_SERVICE_PORT_NUMBER:8082}
---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
---

