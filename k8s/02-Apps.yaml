  selector:
    matchLabels:
      app: fraud-service # Sadece fraud service imagesi icin.
  template:
    metadata:
      labels:
        app: fraud-service # podun etiketi
    spec:
      containers:
        - name: fraud-service
          image: springbankwithmicroservices/fraud-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_fraud
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # PORT
            - name: FRAUD_SERVICE_PORT_NUMBER
              value: "8085"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            - name: KAFKA_TRANSACTION_USER_VALIDATION_SUCCESS_TOPIC
              value: banking-microservices.transaction.user-validation.success.v1
            - name: KAFKA_TRANSACTION_FRAUD_CHECKED_TOPIC
              value: banking-microservices.transaction.fraud.checked.v1
            - name: KAFKA_TRANSACTION_FAILED_TOPIC
              value: banking-microservices.transaction.failed.v1

---

apiVersion: v1
kind: Service
metadata:
  name: fraud-service
  namespace: banking-microservices
spec:
  selector:
    app: fraud-service
  ports:
    - port: 8085
      targetPort: 8085

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-service-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-service
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

---
