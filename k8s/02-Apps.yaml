#Önemli Notlar:

#HPA çalışması için Metrics Server kurulmalı:
#kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#HPA durumunu kontrol et:
#kubectl get hpa -n banking-microservices
#Pod sayısını manuel görmek için:
#kubectl get pods -n banking-microservices

#
#User-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  replicas: 2 # Baslangicta 2 pod calisir. HPA ile 2-6 arasinda otomatik scale olur.
  selector:
    matchLabels:
      app: user-service # olusturulan tum portlar ubnun altinda olusturulacak namespace bu olacak
  template:
    metadata:
      labels:
        app: user-service # User servicenin altinda olusturulanlari burdan duzenle
    spec:
      containers:
        - name: user-service
          image: banking/user-service:1.0.0
          ports:
            - containerPort: 8081 # ContainerPort Label'dir. kubernetes kubectl get pods -o wide kubectl describe pod user-service-xyz kodlaıryla komut calsıtırdııgmızda burdaki port gozukur. Labeldır bu. sprıng bootla aynı olması onerılır bu olmayadabılır.
          resources: # Pod'un kullanacagi CPU ve Memory kaynaklarini tanimlar. Kubernetes buna gore pod'u hangi node'a koyacagina karar verir.
            requests: # Pod'un calismasi icin gereken minimum kaynak. Kubernetes buna gore pod'u node'a atar. Node'da bu kadar kaynak yoksa pod baslatilmaz.
              memory: "256Mi" # 256 Megabyte RAM. Pod baslatilirken en az bu kadar RAM gerekir.
              cpu: "250m" # 250 millicore = 0.25 CPU core. 1000m = 1 CPU core. Pod baslatilirken en az bu kadar CPU gerekir.
            limits: # Pod'un kullanabilecegi maksimum kaynak. Bu limiti asarsa pod restart olur veya throttle edilir (yavaslatilir).
              memory: "512Mi" # Maksimum 512MB RAM kullanabilir. Asarsa pod kill edilir (OOMKilled).
              cpu: "500m" # Maksimum 0.5 CPU core kullanabilir. Asarsa CPU throttle edilir (yavaslatilir ama kill edilmez).
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_users
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411 # SERVICE DISCOVERY GIBI BURAYI ARIYOR VE BULUYOR VE VERILER ZIPKININ BURASINA GIDIYOR HEM ZIPKINE GIDER HEMDE BURAYA GIDER
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # Port Numarasi
            - name: USER_SERVICE_PORT_NUMBER
              value: "8081"
            # --- KAFKA AYARLARI ---
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            # Create User
            - name: KAFKA_CREATE_USER_SENDER
              value: banking-microservices.username-validation.user-service.progress.v1
            - name: KAFKA_CREATE_USER_LISTENER
              value: banking-microservices.create-user.money-service.success.v1
            - name: KAFKA_CREATE_USER_ERROR
              value: banking-microservices.create-user.money-service.error.v1
            # Username Validation
            - name: KAFKA_USERNAME_VALIDATION_SENDER
              value: banking-microservices.username-validation.user-service.success.v1
            - name: KAFKA_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.username-validation.money-service.progress.v1
            - name: KAFKA_USERNAME_VALIDATION_ERROR
              value: banking-microservices.username-validation.money-service.error.v1


---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

---

apiVersion: autoscaling/v2 # Kubernetes'in otomatik scaling (olceklendirme) API'si. Pod sayisini otomatik artirip azaltir.
kind: HorizontalPodAutoscaler # Yatay olceklendirme yapan Kubernetes resource'u. Pod sayisini degistirir (dikey olceklendirme pod'un CPU/Memory limitini artirir).
metadata:
  name: user-service-hpa # HPA'nin adi. kubectl get hpa komutuyla gorulur.
  namespace: banking-microservices
spec:
  scaleTargetRef: # Hangi Deployment'in pod sayisini degistirecek
    apiVersion: apps/v1
    kind: Deployment
    name: user-service # user-service deployment'inin pod sayisini kontrol eder
  minReplicas: 2 # Minimum pod sayisi. Yuk olmasa bile en az 2 pod calisir. High availability (yuksek erisilebilirlik) icin.
  maxReplicas: 6 # Maksimum pod sayisi. Yuk cok artsa bile 6'dan fazla pod baslatilmaz. Maliyet kontrolu icin.
  metrics: # Hangi metriklere gore scaling yapilacak. CPU ve Memory'ye bakarak karar verir.
    - type: Resource # Resource tipi metrik (CPU, Memory gibi). Custom metrikler de olabilir (ornek: HTTP request sayisi).
      resource:
        name: cpu # CPU kullanim oranina gore scale yapar
        target:
          type: Utilization # Utilization = Yuzde olarak kullanim orani
          averageUtilization: 70 # Tum podlarin ortalama CPU'su %70'i gecerse yeni pod ekler. %70'in altina duserse pod azaltir. Ornek: 2 pod var, biri %80 biri %60 kullaniyor, ortalama %70. Yeni pod baslatilir.
    - type: Resource
      resource:
        name: memory # Memory kullanim oranina gore scale yapar
        target:
          type: Utilization
          averageUtilization: 80 # Tum podlarin ortalama memory'si %80'i gecerse yeni pod ekler. Memory leak kontrolu icin CPU'dan daha yuksek tutulur.

---

