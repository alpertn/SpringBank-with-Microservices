#
#Auth-service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: banking/auth-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          env:
            # Postgres Ayarlari
            - name: USER_SERVICE_URL
              value: http://user-service:8081
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_auth
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # Redis Ayarlari
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            # --- KEYCLOAK AYARLARI ---
            - name: KEYCLOAK_SERVER_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_REALM
              value: banking
            - name: KEYCLOAK_CLIENT_ID
              value: banking-app
            - name: KEYCLOAK_CLIENT_SECRET
              value: secret123
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: banking-microservices
spec:
  selector:
    app: auth-service
  ports:
    - port: 8084
      targetPort: 8084
---

#
#Spring Gateway --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: banking/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          env:
            - name: USER_SERVICE_URL # SERVICE DISCOVERY ICIN
              value: http://user-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8084 # SERVICE DISCOVERY ICIN
            - name: MONEY_SERVICE_URL
              value: http://money-service:8082 # SERVICE DISCOVERY ICIN
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083 # SERVICE DISCOVERY ICIN
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/banking
            - name: SPRING_R2DBC_USERNAME
              value: banking_admin
            - name: SPRING_R2DBC_PASSWORD
              value: local_password
            # --- JWT TOKEN AYARI ---
            - name: JWT_TOKEN_ISSUER_URI
              value: http://keycloak:8080/realms/banking
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # Port
            - name: GATEWAY_PORT_NUMBER
              value: "8095"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8095
      targetPort: 8095
  type: LoadBalancer

---

#
# Fraud-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: banking-microservices
spec:
  replicas: 1 # Kac tane pod calistirilacak. Production'da 2-3 yapilabilir yuk dagitimi icin.
  selector:
    matchLabels:
      app: fraud-service # Bu deployment sadece app=fraud-service etiketli podlari yonetir. Selector ve labels eslesmelidir yoksa deployment calismaz.
  template:
    metadata:
      labels:
        app: fraud-service # Olusturdugumuz pod'a yapistirilacak etiket. Yukaridaki selector bunu ariyor.
    spec:
      containers:
        - name: fraud-service
          image: banking/fraud-service:1.0.0
          imagePullPolicy: IfNotPresent # Yerel Docker'da varsa internete gitme. docker build yapildiginda localde olusur. Production'da Always kullan.
          ports:
            - containerPort: 8085 # Fraud-service Spring Boot uygulamasinin calistigi port. kubectl describe pod ile bu port gozukur.
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_fraud
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # --- KAFKA AYARLARI ---
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # PORT
            - name: FRAUD_SERVICE_PORT_NUMBER
              value: "8085"

---

apiVersion: v1
kind: Service
metadata:
  name: fraud-service # Diger servisler fraud-service:8085 seklinde ulasir. Gateway bu servise istek gonderebilir fraud kontrolu icin.
  namespace: banking-microservices
spec:
  selector:
    app: fraud-service # app=fraud-service etiketli podlara gelen istekleri yonlendirir. Birden fazla pod varsa otomatik load balance yapar.
  ports:
    - port: 8085 # Service'in dinledigi port. Diger servisler bu porta istek atar.
      targetPort: 8085 # Container icindeki porta yonlendirir. Spring Boot server.port ile ayni olmali.

---
