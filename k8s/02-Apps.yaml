#Notlar

#HPA çalışması için Metrics Server kurulmalı:
#kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#HPA durumunu kontrol et:
#kubectl get hpa -n banking-microservices
#Pod sayısını manuel görmek için:
#kubectl get pods -n banking-microservices

#
# Gateway Log Reader RBAC — kubectl logs icin gerekli izinler
# Gateway pod'u, banking-microservices namespace'indeki diger pod'larin
# loglarini okuyabilmek icin bu ServiceAccount, Role ve RoleBinding'e ihtiyac duyar.
#

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-log-reader
  namespace: banking-microservices

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-log-reader
  namespace: banking-microservices
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-read-pod-logs
  namespace: banking-microservices
subjects:
  - kind: ServiceAccount
    name: gateway-log-reader
    namespace: banking-microservices
roleRef:
  kind: Role
  name: pod-log-reader
  apiGroup: rbac.authorization.k8s.io

---

#
#User-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#


apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  replicas: 2 # baslangic podlari
  selector:
    matchLabels:
      app: user-service # olusturulan tum portlar ubnun altinda olusturulacak namespace bu olacak
  template:
    metadata:
      labels:
        app: user-service # User servicenin altinda olusturulanlari burdan duzenle
    spec:
      containers:
        - name: user-service
          image: SpringBankWithMicroservices/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources: # Podun calisacagi cpu ve memory scaling
            requests: # Pod minimum ozellikleri
              memory: "256Mi" # min 256mb ram.
              cpu: "250m" # Minimum 250 milicore cpu
            limits: # Pod'un kullanabilecegi maksimum kaynak.
              memory: "512Mi" # Maksimum 512MB RAM kullanabilir.
              cpu: "500m" # Maksimum 0.5 CPU core kullanabilir.
          env:
            # Postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_users
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # Port Numarasi
            - name: USER_SERVICE_PORT_NUMBER
              value: "8081"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            # Create User
            - name: KAFKA_AUTH_SERVICE_CREATE_USER_LISTENER
              value: banking-microservices.create-user.auth-service.progress.v1
            - name: KAFKA_CREATE_USER_SENDER
              value: banking-microservices.username-validation.user-service.progress.v1
            - name: KAFKA_CREATE_USER_LISTENER
              value: banking-microservices.create-user.money-service.success.v1
            - name: KAFKA_CREATE_USER_ERROR
              value: banking-microservices.create-user.money-service.error.v1
            # Username Validation
            - name: KAFKA_USERNAME_VALIDATION_SENDER
              value: banking-microservices.username-validation.user-service.success.v1
            - name: KAFKA_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.username-validation.money-service.progress.v1 # banking-microservices.transaction.money-service.block-money.success.v1
            - name: KAFKA_USERNAME_VALIDATION_ERROR
              value: banking-microservices.username-validation.money-service.error.v1
            # Transaction Validation
            # Diyagram Adim 2: block-money.user-validation.v1'i dinle (user-service icin ozel topic)
            - name: KAFKA_TRANSACTION_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.transaction.money-service.block-money.user-validation.v1
            - name: KAFKA_TRANSACTION_USERNAME_VALIDATION_SENDER
              value: banking-microservices.transaction.user-service.user-validation.success.v1
            # DÜZELTME: Eski topic (user-validation.error.v1) dinlenmiyordu
            - name: KAFKA_TRANSACTION_USERNAME_VALIDATION_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1
            # Kafka Consumer Fix: auto-offset-reset=earliest + StringDeserializer
            - name: SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET
              value: earliest
            - name: SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER
              value: org.apache.kafka.common.serialization.StringDeserializer
            - name: SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER
              value: org.apache.kafka.common.serialization.StringDeserializer


---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

---

apiVersion: autoscaling/v2 # Kubernetin auto scaling api. otomatik pod sayhisini azaltip arttirir
kind: HorizontalPodAutoscaler # pod scaling icin kind.
metadata:
  name: user-service-hpa # hpa name
  namespace: banking-microservices
spec:
  scaleTargetRef: # Hangi Deployment'in pod sayisini degistirecek
    apiVersion: apps/v1
    kind: Deployment
    name: user-service # user-service nin pod sayisini degistiricek
  minReplicas: 1 # Minimum pod
  maxReplicas: 3 # Max pods
  metrics: # Hangi metriklere gore scaling yapacak.
    - type: Resource # resource tip metrics ornek cpu ram
      resource:
        name: cpu # Cpu kullanimina gore scaling icin
        target:
          type: Utilization # yuzde kullanim orani
          averageUtilization: 70 # tum podlarin ortalama cpu kullanimi 70i gecerse pod ekler 70den inerse pod siler
    - type: Resource
      resource:
        name: memory # memory kullanimina gore scaling
        target:
          type: Utilization
          averageUtilization: 80 # tum podlarin ortalama memory kullanimi 80i gecerse pod ekler 80den inerse pod siler

---

#
# Money Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-service
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: money-service
  template:
    metadata:
      labels:
        app: money-service
    spec:
      containers:
        - name: money-service
          image: SpringBankWithMicroservices/money-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_money
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # Harici Zorunlu Olmayanlar
            - name: MONEY_SERVICE_PORT_NUMBER
              value: "8082"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            - name: KAFKA_CREATE_USER_SENDER
              value: banking-microservices.create-user.money-service.success.v1
            - name: KAFKA_CREATE_USER_LISTENER
              value: banking-microservices.username-validation.user-service.progress.v1
            - name: KAFKA_CREATE_USER_ERROR
              value: banking-microservices.create-user.money-service.error.v1
            # Diyagram Adim 1: money-service created.v1'i dinler (eski: user-validation.success.v1)
            - name: KAFKA_TRANSACTION_TOPIC_LISTENER
              value: banking-microservices.transaction.transaction-service.created.v1
            - name: KAFKA_TRANSACTION_TOPIC_SENDER
              value: banking-microservices.transaction.transaction-service.success.v1
            - name: KAFKA_TRANSACTION_TOPIC_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1
            - name: KAFKA_USERNAME_VALIDATION_SENDER
              value: banking-microservices.username-validation.money-service.progress.v1
            - name: KAFKA_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.username-validation.user-service.success.v1
            - name: KAFKA_TRANSACTION_BLOCKUSER_LISTENER
              value: banking-microservices.transaction.transaction-service.created.v1
            - name: KAFKA_TRANSACTION_BLOCKUSER_SENDER
              value: banking-microservices.transaction.money-service.block-money.success.v1
            # Yeni: user-service icin ozel block-money validation topic
            - name: KAFKA_TRANSACTION_BLOCKMONEY_USERVALIDATION_SENDER
              value: banking-microservices.transaction.money-service.block-money.user-validation.v1
            # Diyagram Adim 4 (YENi): fraud-checked.v1'i dinler - TRANSFER gercek para hareketi
            - name: KAFKA_TRANSACTION_TRANSFER_EXECUTE_LISTENER
              value: banking-microservices.transaction.fraud-service.checked.v1
            - name: KAFKA_TRANSACTION_RESULT_SENDER
              value: banking-microservices.transaction.result.success.v1
            # Redis
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"

---

apiVersion: v1
kind: Service
metadata:
  name: money-service
  namespace: banking-microservices
spec:
  selector:
    app: money-service
  ports:
    - port: 8082
      targetPort: 8082

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: money-service-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: money-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

---

#
#Transaction-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: SpringBankWithMicroservices/transaction-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_transactions
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # PORT
            - name: TRANSACTION_SERVICE_PORT_NUMBER
              value: "8083"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_TRANSACTION_TOPIC_SENDER
              value: banking-microservices.transaction.transaction-service.created.v1
            - name: KAFKA_TRANSACTION_TOPIC_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1
            - name: KAFKA_TRANSACTION_USERVALIDATION_LISTENER
              # Diyagram: user-validation.success.v1 user-service'ten fraud-service'e gider.
              # transaction-service bu topic'i sadece STATUS LOG icin izler.
              value: banking-microservices.transaction.user-service.user-validation.success.v1
            # Düzeltme: topicPattern regex syntax - nokta literal için \\.  kullanılmali
            - name: KAFKA_TRANSACTION_LOGGER_LISTENER
              value: 'banking-microservices\.transaction\..*'
            - name: KAFKA_TRANSACTION_RESULT_LISTENER
              value: banking-microservices.transaction.result.success.v1
            # Money-service'den gelen para bloke başarı bildirimi (TRANSFER için)
            - name: KAFKA_TRANSACTION_BLOCKMONEY_LISTENER
              value: banking-microservices.transaction.money-service.block-money.success.v1


---

apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking-microservices
spec:
  selector:
    app: transaction-service
  ports:
    - port: 8083
      targetPort: 8083

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

---

