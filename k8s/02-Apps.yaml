apiVersion: apps/v1
kind: Deployment
metadata:
  name: money-service
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: money-service
  template:
    metadata:
      labels:
        app: money-service
    spec:
      containers:
        - name: money-service
          image: banking/money-service:1.0.0
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_money
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411 # SERVICE DISCOVERY GIBI BURAYI ARIYOR VE BULUYOR VE VERILER ZIPKININ BURASINA GIDIYOR HEM ZIPKINE GIDER HEMDE BURAYA GIDER
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # Harici Zorunlu Olmayanlar
            - name: MONEY_SERVICE_PORT_NUMBER
              value: "8082"
            # --- KAFKA AYARLARI ---
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            - name: KAFKA_CREATE_USER_SENDER
              value: banking-microservices.create-user.money-service.success.v1
            - name: KAFKA_CREATE_USER_LISTENER
              value: banking-microservices.username-validation.user-service.progress.v1
            - name: KAFKA_CREATE_USER_ERROR
              value: banking-microservices.create-user.money-service.error.v1
            - name: KAFKA_TRANSACTION_TOPIC_LISTENER
              value: banking-microservices.transaction.fraud-service.checked.v1
            - name: KAFKA_TRANSACTION_TOPIC_SENDER
              value: banking-microservices.transaction.transaction-service.success.v1
            - name: KAFKA_TRANSACTION_TOPIC_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1
            - name: KAFKA_USERNAME_VALIDATION_SENDER
              value: banking-microservices.username-validation.money-service.progress.v1
            - name: KAFKA_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.username-validation.user-service.success.v1

---

apiVersion: v1
kind: Service
metadata:
  name: money-service
  namespace: banking-microservices
spec:
  selector:
    app: money-service
  ports:
    - port: 8082
      targetPort: 8082

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: money-service-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: money-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

