#
#Spring Gateway --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: banking/gateway:1.0.0
          ports:
            - containerPort: 8095
          resources:
            requests:
              memory: "512Mi" # Gateway tum servislere istek yonlendirdigi icin daha fazla memory kullanir. Diger servisler 256Mi kullanirken gateway 512Mi kullanir.
              cpu: "500m" # Gateway yonetim isleri icin daha fazla CPU kullanir (routing, load balancing, filtering).
            limits:
              memory: "1Gi" # 1 Gigabyte = 1024 Megabyte. Gateway spike traffic (ani trafik artisi) durumunda 1GB'a kadar cikmaya calisabilir.
              cpu: "1000m" # 1 CPU core. Gateway cok yogun trafikte tam bir core kullanabilir.
          env:
            - name: USER_SERVICE_URL # SERVICE DISCOVERY ICIN
              value: http://user-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8084 # SERVICE DISCOVERY ICIN
            - name: MONEY_SERVICE_URL
              value: http://money-service:8082 # SERVICE DISCOVERY ICIN
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083 # SERVICE DISCOVERY ICIN
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/banking
            - name: SPRING_R2DBC_USERNAME
              value: banking_admin
            - name: SPRING_R2DBC_PASSWORD
              value: local_password
            # --- JWT TOKEN AYARI ---
            - name: JWT_TOKEN_ISSUER_URI
              value: http://keycloak:8080/realms/banking
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # Port
            - name: GATEWAY_PORT_NUMBER
              value: "8095"

---

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8095
      targetPort: 8095
  type: LoadBalancer

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

#
# Fraud-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: banking-microservices
spec:
  replicas: 2 # Kac tane pod calistirilacak. Production'da 2-3 yapilabilir yuk dagitimi icin.
  selector:
    matchLabels:
      app: fraud-service # Bu deployment sadece app=fraud-service etiketli podlari yonetir. Selector ve labels eslesmelidir yoksa deployment calismaz.
  template:
    metadata:
      labels:
        app: fraud-service # Olusturdugumuz pod'a yapistirilacak etiket. Yukaridaki selector bunu ariyor.
    spec:
      containers:
        - name: fraud-service
          image: banking/fraud-service:1.0.0
          ports:
            - containerPort: 8085 # Fraud-service Spring Boot uygulamasinin calistigi port. kubectl describe pod ile bu port gozukur.
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres Ayarlari
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_fraud
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: local_password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            # --- ZIPKIN AYARLARI ---
            - name: SPRING_ZIPKIN_BASE_URL
              value: http://zipkin:9411
            - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
              value: "1.0"
            # PORT
            - name: FRAUD_SERVICE_PORT_NUMBER
              value: "8085"
            # --- KAFKA AYARLARI ---
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            - name: KAFKA_TRANSACTION_TOPIC_LISTENER
              value: banking-microservices.transaction.transaction-service.created.v1
            - name: KAFKA_TRANSACTION_TOPIC_SENDER
              value: banking-microservices.transaction.fraud-service.checked.v1
            - name: KAFKA_TRANSACTION_TOPIC_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1

---

apiVersion: v1
kind: Service
metadata:
  name: fraud-service # Diger servisler fraud-service:8085 seklinde ulasir. Gateway bu servise istek gonderebilir fraud kontrolu icin.
  namespace: banking-microservices
spec:
  selector:
    app: fraud-service # app=fraud-service etiketli podlara gelen istekleri yonlendirir. Birden fazla pod varsa otomatik load balance yapar.
  ports:
    - port: 8085 # Service'in dinledigi port. Diger servisler bu porta istek atar.
      targetPort: 8085 # Container icindeki porta yonlendirir. Spring Boot server.port ile ayni olmali.

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fraud-service-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fraud-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---