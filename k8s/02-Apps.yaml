#
#Spring Gateway --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: SpringBankWithMicroservices/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          resources:
            requests:
              memory: "512Mi" # min
              cpu: "500m" # min
            limits:
              memory: "1Gi" # max 1 gb ram
              cpu: "1000m" # max cpu core
          env:
            - name: USER_SERVICE_URL # SERVICE DISCOVERY ICIN
              value: http://user-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8084 # SERVICE DISCOVERY ICIN
            - name: MONEY_SERVICE_URL
              value: http://money-service:8082 # SERVICE DISCOVERY ICIN
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083 # SERVICE DISCOVERY ICIN
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/banking
            - name: SPRING_R2DBC_USERNAME
              value: banking_admin
            - name: SPRING_R2DBC_PASSWORD
              value: banking_admin
            # Jwt token issuer uri
            - name: JWT_TOKEN_ISSUER_URI
              value: http://keycloak:8080/realms/banking

            # Port
            - name: GATEWAY_PORT_NUMBER
              value: "8095"

---

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8095
      targetPort: 8095
  type: LoadBalancer

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---

#
# Fraud-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  namespace: banking-microservices
spec:
  replicas: 2 # Max pod sayisi
  selector:
    matchLabels:
      app: fraud-service # Sadece fraud service imagesi icin.
  template:
    metadata:
      labels:
        app: fraud-service # podun etiketi
    spec:
      containers:
        - name: fraud-service
          image: SpringBankWithMicroservices/fraud-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            # Postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_fraud
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # PORT
            - name: FRAUD_SERVICE_PORT_NUMBER
              value: "8085"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            # Eski: username-validation.success → Yeni akis: block-money.success'i dinle
            - name: KAFKA_TRANSACTION_TOPIC_LISTENER
              value: banking-microservices.transaction.money-service.block-money.success.v1
            - name: KAFKA_TRANSACTION_TOPIC_SENDER
              value: banking-microservices.transaction.fraud-service.checked.v1
            - name: KAFKA_TRANSACTION_TOPIC_ERROR
              value: banking-microservices.transaction.transaction-service.error.v1
            - name: KAFKA_TRANSACTION_TOPIC_DEPOSIT_LISTENER
              value: banking-microservices.transaction.deposit.created.v1
            - name: KAFKA_TRANSACTION_TOPIC_DEPOSIT_SENDER
              value: banking-microservices.transaction.deposit.fraud-checked.v1
            - name: KAFKA_TRANSACTION_TOPIC_WITHDRAW_LISTENER
              value: banking-microservices.transaction.withdraw.created.v1
            - name: KAFKA_TRANSACTION_TOPIC_WITHDRAW_SENDER
              value: banking-microservices.transaction.withdraw.fraud-checked.v1

---

