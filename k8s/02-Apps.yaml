metadata:
  name: gateway-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60

---

#
# Fraud-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
