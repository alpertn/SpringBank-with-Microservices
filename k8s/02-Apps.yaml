#Notlar

#HPA çalışması için Metrics Server kurulmalı:
#kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#HPA durumunu kontrol et:
#kubectl get hpa -n banking-microservices
#Pod sayısını manuel görmek için:
#kubectl get pods -n banking-microservices

#
#User-Service --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  replicas: 2 # baslangic podlari
  selector:
    matchLabels:
      app: user-service # olusturulan tum portlar ubnun altinda olusturulacak namespace bu olacak
  template:
    metadata:
      labels:
        app: user-service # User servicenin altinda olusturulanlari burdan duzenle
    spec:
      containers:
        - name: user-service
          image: SpringBankWithMicroservices/user-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          resources: # Podun calisacagi cpu ve memory scaling
            requests: # Pod minimum ozellikleri
              memory: "256Mi" # min 256mb ram.
              cpu: "250m" # Minimum 250 milicore cpu
            limits: # Pod'un kullanabilecegi maksimum kaynak. Bu limiti asarsa pod restart olur veya throttle edilir (yavaslatilir).
              memory: "512Mi" # Maksimum 512MB RAM kullanabilir. Asarsa pod kill edilir (OOMKilled).
              cpu: "500m" # Maksimum 0.5 CPU core kullanabilir. Asarsa CPU throttle edilir (yavaslatilir ama kill edilmez).
          env:
            # Postgres
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/banking_users
            - name: SPRING_DATASOURCE_USERNAME
              value: banking_admin
            - name: SPRING_DATASOURCE_PASSWORD
              value: banking_admin
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update

            # Port Numarasi
            - name: USER_SERVICE_PORT_NUMBER
              value: "8081"
            # Kafka
            - name: SPRING_APPLICATION_JSON
              value: '{"spring.kafka.bootstrap-servers":"kafka:9092"}'
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            # Kafka Topic
            # Create User
            - name: KAFKA_AUTH_SERVICE_CREATE_USER_LISTENER
              value: banking-microservices.create-user.auth-service.progress.v1
            - name: KAFKA_CREATE_USER_SENDER
              value: banking-microservices.username-validation.user-service.progress.v1
            - name: KAFKA_CREATE_USER_LISTENER
              value: banking-microservices.create-user.money-service.success.v1
            - name: KAFKA_CREATE_USER_ERROR
              value: banking-microservices.create-user.money-service.error.v1
            # Username Validation
            - name: KAFKA_USERNAME_VALIDATION_SENDER
              value: banking-microservices.username-validation.user-service.success.v1
            - name: KAFKA_USERNAME_VALIDATION_LISTENER
              value: banking-microservices.username-validation.money-service.progress.v1
            - name: KAFKA_USERNAME_VALIDATION_ERROR
              value: banking-microservices.username-validation.money-service.error.v1
            # Transaction Validation
            - name: KAFKA_TRANSACTION_USERNAME-VALIDATION_LISTENER
              value: banking-microservices.transaction.money-service.block-money.success.v1
            - name: KAFKA_TRANSACTION_USERNAME-VALIDATION_SENDER
              value: banking-microservices.transaction.user-service.username-validation.success.v1
            - name: KAFKA_TRANSACTION_USERNAME-VALIDATION_ERROR
              value: banking-microservices.transaction.user-service.username-validation.error.v1


---

apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: banking-microservices
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081

---

apiVersion: autoscaling/v2 # Kubernetin auto scaling api. otomatik pod sayhisini azaltip arttirir
kind: HorizontalPodAutoscaler # pod scaling icin kind.
metadata:
  name: user-service-hpa # hpa name
  namespace: banking-microservices
spec:
  scaleTargetRef: # Hangi Deployment'in pod sayisini degistirecek
    apiVersion: apps/v1
    kind: Deployment
    name: user-service # user-service nin pod sayisini degistiricek
  minReplicas: 2 # Minimum pod
  maxReplicas: 6 # Max pods
  metrics: # Hangi metriklere gore scaling yapacak.
    - type: Resource # resource tip metrics ornek cpu ram
      resource:
        name: cpu # Cpu kullanimina gore scaling icin
        target:
          type: Utilization # yuzde kullanim orani
          averageUtilization: 70 # tum podlarin ortalama cpu kullanimi 70i gecerse pod ekler 70den inerse pod siler
    - type: Resource
      resource:
        name: memory # memory kullanimina gore scaling
        target:
          type: Utilization
          averageUtilization: 80 # tum podlarin ortalama memory kullanimi 80i gecerse pod ekler 80den inerse pod siler

---

