#
#Spring Gateway --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      serviceAccountName: gateway-log-reader
      containers:
        - name: gateway
          image: SpringBankWithMicroservices/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8095
          resources:
            requests:
              memory: "256Mi" # min
              cpu: "200m" # min
            limits:
              memory: "512Mi" # max 512 mb ram
              cpu: "500m" # max cpu core
          env:
            - name: USER_SERVICE_URL # SERVICE DISCOVERY ICIN
              value: http://user-service:8081
            - name: AUTH_SERVICE_URL
              value: http://auth-service:8084 # SERVICE DISCOVERY ICIN
            - name: MONEY_SERVICE_URL
              value: http://money-service:8082 # SERVICE DISCOVERY ICIN
            - name: TRANSACTION_SERVICE_URL
              value: http://transaction-service:8083 # SERVICE DISCOVERY ICIN
            - name: FRAUD_SERVICE_URL
              value: http://fraud-service:8085 # SERVICE DISCOVERY ICIN
            - name: REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/banking
            - name: SPRING_R2DBC_USERNAME
              value: banking_admin
            - name: SPRING_R2DBC_PASSWORD
              value: banking_admin
            # Jwt token issuer uri
            - name: JWT_TOKEN_ISSUER_URI
              value: http://keycloak:8080/realms/banking

            # Port
            - name: GATEWAY_PORT_NUMBER
              value: "8095"

---

apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: banking-microservices
spec:
  selector:
    app: gateway
  ports:
    - port: 8095
      targetPort: 8095
  type: LoadBalancer

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-hpa
  namespace: banking-microservices
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 1
