server:
  port: ${ADMIN_SERVICE_QUERY_PORT:8098}

spring:
  application:
    name: admin-service-query
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/banking_admin_query}
    elasticsearch:
      repositories:
        enabled: true
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://elasticsearch:9200}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SPRING_KAFKA_CONSUMER_GROUP_ID:admin-service-query-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

grpc:
  server:
    port: ${ADMIN_SERVICE_QUERY_GRPC_PORT:9198}

admin-service:
  topics:
    projection-sync: ${ADMIN_SERVICE_PROJECTION_TOPIC:banking-microservices.admin.history.projection-sync.v1}

management:
  endpoints:
    web:
      base-path: /api/admin-service-query/actuator
      exposure:
        include: health,info

logging:
  pattern:
    console: "%-5level --- [admin-service-query] : %msg%n"
