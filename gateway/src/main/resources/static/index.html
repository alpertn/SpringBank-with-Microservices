<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBank - Panel</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: 50px;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #1a73e8;
            margin-bottom: 5px;
        }

        h2 {
            color: #5f6368;
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 20px;
        }

        .token-box {
            background: #333;
            color: #0f0;
            font-family: monospace;
            font-size: 11px;
            text-align: left;
            padding: 15px;
            border-radius: 8px;
            word-break: break-all;
            margin: 20px 0;
            overflow-y: auto;
            max-height: 150px;
        }

        button.logout-btn {
            padding: 10px 20px;
            background-color: #d93025;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button.logout-btn:hover {
            background-color: #b31412;
        }

        .test-section {
            margin-top: 30px;
            text-align: left;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .test-section button {
            padding: 8px 15px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .test-section button:hover {
            background-color: #2b60bd;
        }

        #apiResponse {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-top: 15px;
            font-family: monospace;
            font-size: 13px;
            color: #333;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SpringBank Paneli</h1>
        <h2>Hoşgeldiniz! Başarıyla giriş yaptınız.</h2>

        <div style="text-align: left;">
            <strong>JWT Access Token:</strong>
            <div class="token-box" id="tokenDisplay"></div>
        </div>

        <button class="logout-btn" onclick="logout()">Çıkış Yap</button>

        <div class="test-section">
            <h3 style="margin-top:0;">API Test Alanı</h3>
            <p style="font-size: 13px; color: #666;">Yukarıdaki token kullanılarak mikroservislere istek atılacaktır.
            </p>
            <button onclick="testApi('/api/users/profile')">Profilimi Getir</button>
            <button onclick="testApi('/api/accounts')">Hesaplarım</button>

            <div id="apiResponse">Yanıt bekleniyor...</div>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde token yoksa login'e gönder
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/login.html';
        } else {
            // Ekranda tokeni göster
            document.getElementById('tokenDisplay').innerText = token;
        }

        // Çıkış yap fonksiyonu
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/login.html';
        }

        // Tokenla Mikroservise istek at
        async function testApi(endpoint) {
            const responseBox = document.getElementById('apiResponse');
            responseBox.innerText = 'İstek atılıyor: ' + endpoint + '...';

            try {
                const response = await fetch(endpoint, {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.text(); // json garantisi yok diye text alıyoruz test icin
                    try {
                        // Eğer JSON gelirse güzelleştir
                        const json = JSON.parse(data);
                        responseBox.innerText = JSON.stringify(json, null, 2);
                    } catch (e) {
                        responseBox.innerText = data; // Düz string formatında bas
                    }
                } else {
                    responseBox.innerText = 'HATA (' + response.status + '): ' + await response.text();

                    // Örn token süresi dolduysa:
                    if (response.status === 401) {
                        alert("Oturum süresi dolmuş veya yetkisiz istek.");
                        logout();
                    }
                }
            } catch (error) {
                responseBox.innerText = 'Bağlantı Hatası:\n' + error;
            }
        }
    </script>
</body>

</html>
