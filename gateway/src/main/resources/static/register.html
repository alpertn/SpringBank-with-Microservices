<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBank - Müşteri Ol</title>
    <!-- Sadece Bootstrap 4.6 dahil edildi -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<!-- Sayfa Ortalanmış Kayıt Kutusu -->
<div class="auth-wrapper py-5">
    <div class="auth-card" style="max-width: 500px;">
        <h3 class="text-center font-weight-bold mb-1 text-primary">SpringBank</h3>
        <p class="text-center text-muted mb-4">Yeni Müşteri Kaydı</p>
        <!-- Yeni Kullanıcı Kayıt Formu (JS tarafından yakalanır) -->
        <form id="registerForm">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Adınız</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Adınız" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Soyadınız</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Soyadınız" required>
                </div>
            </div>

            <div class="form-group">
                <label>E-Posta Adresiniz</label>
                <input type="email" class="form-control" id="email" placeholder="ornek@springbank.com" required>
            </div>

            <div class="form-group">
                <label>Şifre Belirleyin</label>
                <input type="password" class="form-control" id="password" placeholder="En az 6 karakter" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block mt-4" id="regBtn">Kayıt Ol</button>
        </form>

        <!-- JS'den gelen hata veya başarı mesajları buraya yazdırılır -->
        <div id="msg" class="alert mt-3" style="display:none; font-size:14px;"></div>

        <hr>

        <div class="text-center mt-3">
            <small class="text-muted">
                Zaten üye misiniz? <a href="/login.html">Giriş Yap</a>
            </small>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/register.js"></script>
</body>

</html>
