<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBank - Giriş Yap</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: #f0f2f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #1a73e8;
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        button:hover {
            background-color: #1557b0;
        }

        .error {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .link {
            margin-top: 20px;
            font-size: 14px;
        }

        .link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Giriş Yap</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-posta Adresi" required value="testuser@bank.com">
            <input type="password" id="password" placeholder="Şifre" required value="pass123">
            <button type="submit">Giriş</button>
        </form>
        <div id="errorMsg" class="error">Giriş başarısız. Lütfen bilgilerinizi kontrol edin.</div>
        <div class="link">
            Hesabın yok mu? <a href="/register.html">Kayıt Ol</a>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde zaten giriş yapılmışsa ana sayfaya yönlendir
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.access_token) {
                        // Token'ı tarayıcıda sakla
                        localStorage.setItem('token', data.access_token);
                        // Ana sayfaya yönlendir
                        window.location.href = '/';
                    } else {
                        errorMsg.style.display = 'block';
                    }
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error('Hata:', error);
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'Sunucuya bağlanılamadı!';
            }
        });
    </script>
</body>

</html>
