<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBank - Dijital Bankacılık Giriş</title>
    <!-- Sadece Bootstrap 4.6 dahil edildi -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<!-- Sayfa Ortalanmış Oturum Açma Kutusu -->
<div class="auth-wrapper">
    <div class="auth-card">
        <h3 class="text-center font-weight-bold mb-1 text-primary">SpringBank</h3>
        <p class="text-center text-muted mb-4">Müşteri Girişi</p>
        <!-- Kullanıcı Giriş Formu (JS tarafından yakalanır) -->
        <form id="loginForm">
            <div class="form-group">
                <label>E-Posta Adresi</label>
                <input type="email" class="form-control" id="email" placeholder="ornek@springbank.com" required>
            </div>
            <div class="form-group">
                <label>Müşteri Şifresi</label>
                <input type="password" class="form-control" id="password" placeholder="Şifreniz" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Giriş Yap</button>
        </form>

        <!-- JS'den gelen hata veya başarı mesajları buraya yazdırılır -->
        <div id="msg" class="alert mt-3" style="display:none; font-size:14px;"></div>

        <hr>

        <div class="text-center mt-3">
            <small class="text-muted">
                Hesabınız yok mu? <a href="/register.html">Kayıt Olun</a>
            </small>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body>

</html>
