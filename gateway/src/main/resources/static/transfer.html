<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpringBank - Para Transferi</title>
    <!-- Sadece Bootstrap 4.6 dahil edildi -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="bg-light">

    <!-- Standart Bootstrap Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">SpringBank</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard.html">Hesap Özeti</a>
                    </li>
                    <li class="nav-item active">
                        <a class="nav-link" href="/transfer.html">Para Transferi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin.html">Yetkili Paneli</a>
                    </li>
                </ul>
                <ul class="navbar-nav ml-auto align-items-center">
                    <li class="nav-item dropdown mr-3">
                        <a class="nav-link nav-icon" href="#" id="notifDropdown" role="button" data-toggle="dropdown"
                            aria-haspopup="true" aria-expanded="false">
                            🔔 <span class="badge badge-danger badge-notify" id="notifBadge">2</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow-sm border-0"
                            aria-labelledby="notifDropdown" style="width: 300px;">
                            <h6 class="dropdown-header font-weight-bold border-bottom pb-2">Bildirimlerim</h6>
                            <div id="notificationList">
                                <a class="dropdown-item py-2 border-bottom" style="font-size:13px" href="#">Hesabınıza
                                    giriş yapıldı. (IP: 192.168.1.1)</a>
                                <a class="dropdown-item py-2" style="font-size:13px" href="#">SpringBank'a hoş
                                    geldiniz!</a>
                            </div>
                        </div>
                    </li>
                    <li class="nav-item">
                        <button class="btn btn-outline-light btn-sm" onclick="API.logout()">Güvenli Çıkış</button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Ana İcerik Konteyneri -->
    <div class="container my-5">
        <h4 class="mb-1 font-weight-bold text-dark">Para Transferi (EFT/Havale)</h4>
        <p class="text-muted mb-4">Güvenli bir şekilde para transferini gerçekleştirin.</p>

        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <!-- Para Transfer Formu -->
                        <form id="transferForm">
                            <div class="form-group">
                                <label class="text-muted small font-weight-bold">Gönderen IBAN</label>
                                <input type="text" class="form-control" id="senderIban" placeholder="TR..." required>
                            </div>
                            <div class="form-group">
                                <label class="text-muted small font-weight-bold">Alıcı IBAN</label>
                                <input type="text" class="form-control" id="receiverIban" placeholder="TR..." required>
                            </div>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label class="text-muted small font-weight-bold">Alıcı Adı</label>
                                    <input type="text" class="form-control" id="receiverName" placeholder="Adı"
                                        required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label class="text-muted small font-weight-bold">Alıcı Soyadı</label>
                                    <input type="text" class="form-control" id="receiverSurname" placeholder="Soyadı"
                                        required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="text-muted small font-weight-bold">İşlem Tutarı (₺)</label>
                                <input type="number" class="form-control" id="amount" placeholder="0.00" step="0.01"
                                    min="0.01" required>
                            </div>
                            <div class="form-group">
                                <label class="text-muted small font-weight-bold">Açıklama (İsteğe Bağlı)</label>
                                <input type="text" class="form-control" id="description"
                                    placeholder="Transfer açıklaması giriniz...">
                            </div>
                            <hr class="mt-4 mb-4">
                            <button type="submit" class="btn btn-primary btn-block py-2" id="transferBtn">Transferi
                                Onayla</button>
                        </form>
                        <!-- JS'den gelen mesaj alanı -->
                        <div id="msg" class="alert mt-3 mb-0" style="display:none; font-size:14px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/transfer.js"></script>
</body>

</html>
