server:
  port: ${TRANSACTION_SERVICE_PORT_NUMBER:8083}

kafka:
  topics:
    transaction:
      listener: ${KAFKA_TRANSACTION_TOPIC_LISTENER:banking-microservices.transaction.transaction-service.success.v1}
      sender: ${KAFKA_TRANSACTION_TOPIC_SENDER:banking-microservices.transaction.transaction-service.created.v1}
      error: ${KAFKA_TRANSACTION_TOPIC_ERROR:banking-microservices.transaction.transaction-service.error.v1}
      deposit:
        sender: ${KAFKA_TRANSACTION_TOPIC_DEPOSIT_SENDER:banking-microservices.transaction.deposit.created.v1}
        listener: ${KAFKA_TRANSACTION_TOPIC_DEPOSIT_LISTENER:banking-microservices.transaction.deposit.money-service.success.v1}
      withdraw:
        sender: ${KAFKA_TRANSACTION_TOPIC_WITHDRAW_SENDER:banking-microservices.transaction.withdraw.created.v1}
        listener: ${KAFKA_TRANSACTION_TOPIC_WITHDRAW_LISTENER:banking-microservices.transaction.withdraw.money-service.success.v1}
      logger:
        listener: ${KAFKA_TRANSACTION_LOGGER_LISTENER:banking-microservices.transaction.*}

spring:
  application:
    name: transaction-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transaction-service-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_transactions}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  pattern:
    console: "%-5level --- [transaction-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN