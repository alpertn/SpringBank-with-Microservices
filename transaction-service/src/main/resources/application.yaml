server:
  port: ${TRANSACTION_SERVICE_PORT_NUMBER:8083}

kafka:
  topics:
    transaction:
      # SENDER: transaction-service bu topic'e gönderir; fraud-service ve money-service dinler.
      # LISTENER: transaction-service bu topic'i artık DİNLEMİYOR çünkü kendi gönderdiği topic'i
      #           dinlemek sonsuz döngüye yol açar. created.v1 yalnızca fraud-service tarafından dinlenir.
      sender: ${KAFKA_TRANSACTION_TOPIC_SENDER:banking-microservices.transaction.transaction-service.created.v1}
      error: ${KAFKA_TRANSACTION_TOPIC_ERROR:banking-microservices.transaction.transaction-service.error.v1}
      blockmoney:
        listener: ${KAFKA_TRANSACTION_BLOCKMONEY_LISTENER:banking-microservices.transaction.money-service.block-money.success.v1}
      user-validation:
        listener: ${KAFKA_TRANSACTION_USERVALIDATION_LISTENER:banking-microservices.transaction.user-service.user-validation.success.v1}
      logger:
        # Düzeltme: Kafka topicPattern regex kullanır. Nokta (.) regex'te özel karakter,
        # literal nokta için \. kullanılmalı. Bu nedenle pattern'de \\. yazılır.
        listener: ${KAFKA_TRANSACTION_LOGGER_LISTENER:banking-microservices\.transaction\..*}
      result:
        listener: ${KAFKA_TRANSACTION_RESULT_LISTENER:banking-microservices.transaction.result.success.v1}

spring:
  application:
    name: transaction-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transaction-service-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_transactions}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      base-path: /api/transaction-service/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    kafka:
      enabled: false
  security:
    enabled: false

logging:
  pattern:
    console: "%-5level --- [transaction-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN