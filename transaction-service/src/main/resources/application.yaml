server:
  port: ${TRANSACTION_SERVICE_PORT_NUMBER:8083}

grpc:
  client:
    user-service-token:
      address: ${USER_SERVICE_GRPC_ADDRESS:static://localhost:9194}
      negotiationType: plaintext

kafka:
  topics:
    transaction:
      # SENDER: transaction-service bu topic'e gönderir; fraud-service ve money-service dinler.
      # LISTENER: transaction-service bu topic'i artık DİNLEMİYOR çünkü kendi gönderdiği topic'i
      #           dinlemek sonsuz döngüye yol açar. created.v1 yalnızca fraud-service tarafından dinlenir.
      sender: ${KAFKA_TRANSACTION_CREATED_TOPIC:banking-microservices.transaction.created.v1}
      error: ${KAFKA_TRANSACTION_FAILED_TOPIC:banking-microservices.transaction.failed.v1}
      blockmoney:
        listener: ${KAFKA_TRANSACTION_MONEY_BLOCKED_TOPIC:banking-microservices.transaction.money-blocked.v1}
      user-validation:
        listener: ${KAFKA_TRANSACTION_USER_VALIDATION_SUCCESS_TOPIC:banking-microservices.transaction.user-validation.success.v1}
      logger:
        # Düzeltme: Kafka topicPattern regex kullanır. Nokta (.) regex'te özel karakter,
        # literal nokta için \. kullanılmalı. Bu nedenle pattern'de \\. yazılır.
        listener: ${KAFKA_TRANSACTION_LOGGER_LISTENER:banking-microservices\.transaction\..*}
      result:
        listener: ${KAFKA_TRANSACTION_COMPLETED_TOPIC:banking-microservices.transaction.completed.v1}

        # Saga

      saga:
        listener: ${KAFKA_TRANSACTION_SAGA_CREATED_TOPIC:banking-microservices.transaction.saga.created.v1}
        sender: ${KAFKA_TRANSACTION_SAGA_MONEY_COMPLETED_TOPIC:banking-microservices.transaction.saga.money.completed.v1}
        error: ${KAFKA_TRANSACTION_SAGA_MONEY_FAILED_TOPIC:banking-microservices.transaction.saga.money.failed.v1}
spring:
  application:
    name: transaction-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: transaction-service-group
  cloud:
    kubernetes:
      discovery:
        enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/banking_transactions}
    username: ${SPRING_DATASOURCE_USERNAME:banking_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:local_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      max-lifetime: 580000 # Connection ne zaman yenilensin
      keepalive-time: 150000 # Boşta duran connection ölmesin diye ping
      connection-timeout: 20000 # Connection bulamazsa ne kadar beklensin
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      base-path: /api/transaction-service/actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    kafka:
      enabled: false
  security:
    enabled: false

logging:
  pattern:
    console: "%-5level --- [transaction-service] : %msg%n"
  level:
    root: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
